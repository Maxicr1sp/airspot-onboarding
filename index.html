<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Airspot Onboarding Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #1f5bff;
    --primary-hover: #1749d6;
    --primary-soft: #eaf0ff;
    --text: #0f172a;
    --muted: #64748b;
    --subtle: #94a3b8;
    --border: #e6e8ee;
    --surface: #ffffff;
    --sidebar: #fafafb;
    --ok: #16a34a;
    --ok-soft: #e8f7ee;
    --warn: #d97706;
    --warn-soft: #fff6e5;
    --err: #dc2626;
    --err-soft: #fdecec;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, system-ui, sans-serif; color: var(--text); font-size: 15px;
    background: linear-gradient(160deg, #e3f2ff 0%, #f5f9ff 35%, #f4fbf8 70%, #e6f8f1 100%);
    background-attachment: fixed; min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }

  /* Shell */
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 24px;
    padding: 14px 28px; background: rgba(255,255,255,.75); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 24px; letter-spacing: -.02em; }
  /* Supplied logo has a white wordmark, so crop to the icon and set the wordmark in dark text */
  .logo-icon { width: 34px; height: 31px; overflow: hidden; flex: none; }
  .logo-icon img { height: 31px; display: block; }
  .swatch { display: block; position: relative; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; overflow: hidden; }
  .swatch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: 0; padding: 0; }
  .swatch-wrap { position: relative; }
  .swatch-x { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border); background: #fff; color: var(--muted); font-size: 10px; line-height: 1; padding: 0; display: grid; place-items: center; }
  .swatch.add { display: grid; place-items: center; background: #fff; border-style: dashed; color: var(--muted); font-size: 18px; padding: 0; }
  textarea.input { resize: vertical; line-height: 1.5; min-height: 96px; }
  .logo-tile { width: 72px; height: 72px; border-radius: 16px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 26px; overflow: hidden; border: 0; padding: 0; position: relative; }
  .logo-tile img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .logo-tile .ov { position: absolute; inset: 0; background: rgba(15,23,42,.55); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
  .logo-tile:hover .ov { opacity: 1; }
  .render-canvas { width: 100%; aspect-ratio: 16/9; border-radius: 12px; background: #0b0f1a; display: block; }
  .stepper { display: flex; gap: 6px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .stepper .s { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 13px; color: var(--subtle); }
  .stepper .s .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; border: 1px solid var(--border); background: #fff; }
  .stepper .s.done { color: var(--muted); }
  .stepper .s.done .n { background: var(--ok); border-color: var(--ok); color: #fff; }
  .stepper .s.cur { color: var(--primary); background: var(--primary-soft); font-weight: 600; }
  .stepper .s.cur .n { background: var(--primary); border-color: var(--primary); color: #fff; }
  .link-btn { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 6px 8px; border-radius: 8px; }
  .link-btn:hover { background: #f1f5f9; color: var(--text); }

  main { max-width: 1080px; margin: 0 auto; padding: 36px 24px 120px; }
  .narrow { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 34px; letter-spacing: -.025em; margin: 0 0 8px; line-height: 1.15; }
  h2 { font-size: 18px; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  .lead { color: var(--muted); font-size: 16px; margin: 0 0 28px; line-height: 1.5; }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
  .grid2 { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; }
  .sticky { position: sticky; top: 92px; }
  .stack > * + * { margin-top: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }

  .btn { border: 1px solid var(--border); background: #fff; color: var(--text); padding: 11px 18px; border-radius: 12px; font-weight: 500; }
  .btn:hover { border-color: #cbd5e1; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.primary:disabled { background: #b8c8f7; border-color: #b8c8f7; cursor: not-allowed; }
  .btn.lg { padding: 14px 22px; font-size: 16px; border-radius: 14px; }
  .btn.block { width: 100%; }

  .field { display: block; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: #fff; outline: none; }
  .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 14px; color: var(--text); }
  .chip:hover { border-color: #cbd5e1; }
  .chip.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 500; }
  .chip.sugg::before { content: "✦ "; color: #a78bfa; }

  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .option { text-align: left; border: 1.5px solid var(--border); background: #fff; border-radius: 16px; padding: 18px; }
  .option:hover { border-color: #cbd5e1; }
  .option.on { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .option .ico { font-size: 22px; margin-bottom: 8px; }
  .option .t { font-weight: 600; margin-bottom: 4px; }
  .option .d { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .option .see { margin-top: 10px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 10px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.grey { background: #f1f5f9; color: var(--muted); }

  .notice { border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.45; }
  .notice.ok { background: var(--ok-soft); color: #14532d; }
  .notice.warn { background: var(--warn-soft); color: #7c4a03; }
  .notice.err { background: var(--err-soft); color: #7f1d1d; }
  .notice.info { background: var(--primary-soft); color: #1e3a8a; }

  .stat { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .stat:last-child { border-bottom: 0; }
  .stat .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .stat .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; }
  .meter { height: 8px; border-radius: 999px; background: #eef2f7; overflow: hidden; margin-top: 8px; }
  .meter > div { height: 100%; border-radius: 999px; transition: width .3s; }

  .footer-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,.9); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border); padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; z-index: 9; }

  .video { aspect-ratio: 16/9; border-radius: 18px; overflow: hidden; position: relative; display: grid; place-items: center;
    background: radial-gradient(circle at 30% 30%, #3b82f6, #1e1b4b 70%); color: #fff; }
  .video iframe, .video .poster { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  .play { position: absolute; left: 6%; bottom: 9%; display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.95); color: var(--primary); border: 0; font-size: 15px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .play:hover { background: #fff; }

  .tv { background: #0b0f1a; border-radius: 14px; padding: 10px; box-shadow: var(--shadow); }
  .tv-screen { aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 22px; }
  .tv-screen video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .tv-stand { width: 30%; height: 8px; margin: 8px auto 0; border-radius: 0 0 8px 8px; background: #1f2937; }

  .summary-row { display: grid; grid-template-columns: 140px 1fr auto; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); align-items: start; }
  .summary-row:last-child { border-bottom: 0; }
  .summary-row .k { color: var(--muted); font-size: 14px; }
  .summary-row .edit { font-size: 13px; color: var(--primary); background: none; border: 0; }

  .drop { border: 2px dashed #cbd5e1; border-radius: 16px; padding: 28px; text-align: center; background: #fbfcfe; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 14px; }
  .check .i { width: 20px; flex: none; text-align: center; }

  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding-bottom: 18px; position: relative; }
  .timeline li::before { content: ""; position: absolute; left: 13px; top: 26px; bottom: 0; width: 2px; background: var(--border); }
  .timeline li:last-child::before { display: none; }
  .timeline .dot { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-size: 13px; font-weight: 700; }

  .auth { max-width: 440px; margin: 40px auto 0; }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--subtle); font-size: 13px; margin: 18px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* Prototype control panel (not part of the product UI) */
  .proto-fab { position: fixed; right: 20px; bottom: 84px; z-index: 30; background: #111827; color: #fff; border: 0; border-radius: 999px; padding: 10px 16px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .proto { position: fixed; right: 20px; bottom: 132px; z-index: 30; width: 360px; max-height: 70vh; overflow: auto; background: #111827; color: #e5e7eb; border-radius: 16px; padding: 18px; font-size: 13px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .proto h4 { margin: 0 0 10px; color: #fff; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .proto .seg { display: flex; background: #1f2937; border-radius: 10px; padding: 3px; margin-bottom: 8px; }
  .proto .seg button { flex: 1; background: none; border: 0; color: #9ca3af; padding: 7px; border-radius: 8px; font-size: 12px; }
  .proto .seg button.on { background: #374151; color: #fff; }
  .proto .ev { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; padding: 5px 0; border-bottom: 1px solid #1f2937; color: #a5f3fc; }
  .proto .ev span { color: #6b7280; }
  .proto button.pbtn { background: #1f2937; color: #e5e7eb; border: 0; border-radius: 8px; padding: 7px 10px; font-size: 12px; }

  /* Dashboard */
  .dash { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .side { background: var(--sidebar); border-right: 1px solid var(--border); padding: 20px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; }
  .side .nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--text); border: 0; background: none; width: 100%; text-align: left; font-size: 15px; }
  .side .nav:hover { background: #f1f5f9; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #f8fafc; }
  .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; white-space: nowrap; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 16px; }
  .kpis .card { padding: 6px 20px; }
  .sim { display: flex; align-items: center; gap: 14px; margin-top: 20px; background: #111827; color: #e5e7eb; border-radius: 12px; padding: 10px 16px; font-size: 13px; }
  .sim input { flex: 1; accent-color: #38bdf8; }
  .seg-toggle { position: fixed; top: 16px; right: 20px; z-index: 20; display: flex; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 3px; box-shadow: var(--shadow); }
  .seg-toggle button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font-size: 13px; color: var(--muted); }
  .seg-toggle button.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .step-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.45); display: grid; place-items: center; padding: 16px; animation: fade .15s ease; }
  .modal { width: 100%; max-width: 460px; }
  .btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
  .btn.danger-outline { color: var(--err); border-color: #fecaca; background: #fff; }
  .btn.icon { padding: 7px 10px; }
  .btn.icon:hover { border-color: #fecaca; background: var(--err-soft); }
  .detail-grid { display: grid; grid-template-columns: 1fr 360px; gap: 16px; margin-top: 16px; align-items: start; }
  .thumb { width: 72px; height: 40px; border-radius: 8px; flex: none; overflow: hidden; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #1f5bff, #38bdf8); }
  .thumb video { width: 100%; height: 100%; object-fit: cover; }
  .dot-l { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: 13px; }
  .link-btn.on { color: var(--primary); font-weight: 600; }
  .budget-slider { padding-top: 4px; }
  .slider-wrap { position: relative; padding: 10px 0 30px; }
  .slider-wrap input { width: 100%; accent-color: var(--primary); cursor: pointer; }
  .slider-wrap .mark { position: absolute; top: 36px; transform: translateX(-50%); font-size: 11px; color: var(--subtle); white-space: nowrap; }
  .slider-wrap .mark::before { content: ""; position: absolute; left: 50%; top: -9px; width: 1px; height: 6px; background: #cbd5e1; }
  .slider-wrap .mark.on { color: var(--primary); font-weight: 600; }
  .coverage { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .step-card.current { border: 2px solid var(--ok); box-shadow: 0 0 0 4px var(--ok-soft), var(--shadow); }
  .seg.dark { display: flex; background: #1f2937; border-radius: 10px; padding: 3px; margin-left: auto; }
  .seg.dark button { background: none; border: 0; color: #9ca3af; padding: 6px 12px; border-radius: 8px; font-size: 12px; }
  .seg.dark button.on { background: #374151; color: #fff; }
  .weeks td, .weeks th { padding: 12px; }
  .step-ico { width: 48px; height: 48px; border-radius: 14px; background: var(--primary-soft); display: grid; place-items: center; font-size: 24px; }
  .side .nav.on { background: var(--primary-soft); color: var(--primary); font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 12px; border-bottom: 1px solid var(--border); }
  td { padding: 16px 12px; border-bottom: 1px solid var(--border); }

  .spinner { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--primary-soft); border-top-color: var(--primary); animation: spin 0.8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 860px) {
    .grid2 { grid-template-columns: 1fr; }
    .sticky { position: static; }
    .options { grid-template-columns: 1fr; }
    .stepper { display: none; }
    .dash { grid-template-columns: 1fr; }
    .kpis, .step-cards { grid-template-columns: 1fr 1fr; }
    .review-side { order: -1; }
    .detail-grid { grid-template-columns: 1fr; }
    .seg-toggle { top: auto; bottom: 84px; left: 16px; right: auto; }
    .side { display: none; }
    h1 { font-size: 26px; }
    main { padding: 24px 16px 120px; }
    .topbar, .footer-nav { padding: 12px 16px; }
    .proto { width: calc(100% - 32px); right: 16px; }
    .summary-row { grid-template-columns: 1fr auto; }
    .summary-row .k { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useRef, useMemo } = React;
const html = htm.bind(React.createElement);

/* ---------- Assumptions (illustrative, tune with real DSP data) ---------- */
const CPM = 32;              // USD per 1,000 impressions
const MIN_DAILY = 50;        // Airspot minimum daily budget
const INTRO_VIDEO = "https://www.youtube-nocookie.com/embed/dSbw0FTsLPA"; // youtu.be/dSbw0FTsLPA
const TARGET_FREQ = 3;       // impressions per household over the flight
const CTV_SHARE = 0.7;       // share of households reachable on CTV
const APPROVAL_DAYS = 2;     // creative review lead time

const COUNTRIES = {
  SE: { name: "Sweden", hh: 4.8e6, cities: { Stockholm: 1.1e6, Gothenburg: 0.5e6, "Malmö": 0.3e6, Uppsala: 0.1e6 },
    regions: { "Stockholm County": { hh: 1.2e6, cities: ["Stockholm"] }, "Västra Götaland": { hh: 0.85e6, cities: ["Gothenburg"] },
      "Skåne": { hh: 0.65e6, cities: ["Malmö"] }, "Uppsala County": { hh: 0.18e6, cities: ["Uppsala"] } } },
  DE: { name: "Germany", hh: 41e6, cities: { Berlin: 2e6, Hamburg: 1e6, Munich: 0.8e6, Cologne: 0.55e6 },
    regions: { Berlin: { hh: 2e6, cities: ["Berlin"] }, Hamburg: { hh: 1e6, cities: ["Hamburg"] },
      Bavaria: { hh: 6.5e6, cities: ["Munich"] }, "North Rhine-Westphalia": { hh: 8.9e6, cities: ["Cologne"] } } },
  GB: { name: "United Kingdom", hh: 28e6, cities: { London: 3.6e6, Manchester: 1.2e6, Birmingham: 1.1e6, Leeds: 0.75e6 },
    regions: { "Greater London": { hh: 3.6e6, cities: ["London"] }, "North West": { hh: 3.1e6, cities: ["Manchester"] },
      "West Midlands": { hh: 2.4e6, cities: ["Birmingham"] }, "Yorkshire": { hh: 2.3e6, cities: ["Leeds"] } } },
  US: { name: "United States", hh: 131e6, cities: { "New York": 7.5e6, "Los Angeles": 4.6e6, Chicago: 3.5e6, Austin: 0.9e6 },
    regions: { "New York State": { hh: 7.8e6, cities: ["New York"] }, California: { hh: 13.4e6, cities: ["Los Angeles"] },
      Illinois: { hh: 4.9e6, cities: ["Chicago"] }, Texas: { hh: 10.5e6, cities: ["Austin"] } } },
};
const AGES = { "18–34": 0.3, "35–54": 0.38, "55+": 0.32 };
const INCOME = { Any: 1, "Middle+": 0.45, High: 0.2 };
const KIDS = { Any: 1, "With kids": 0.3, "No kids": 0.7 };
const GENDER = { All: 1, Women: 0.51, Men: 0.49 };

const CATEGORIES = {
  "Food & drink": ["Coffee lovers", "Foodies", "Healthy eating", "Local shoppers", "Home cooks"],
  "Health & wellness": ["Fitness enthusiasts", "Healthy living", "Wellness seekers", "Parents", "Outdoor & sports"],
  "Fashion & retail": ["Fashion forward", "Sustainable shoppers", "Online shoppers", "Luxury buyers", "Deal seekers"],
  "Home & living": ["Homeowners", "Interior design", "DIY & garden", "New movers", "Families"],
  "Services & B2B": ["Business decision makers", "Small business owners", "Tech early adopters", "Professionals", "Finance & investing"],
};
const CATEGORY_KEYWORDS = [
  ["Food & drink", /coffee|brew|cafe|food|bake|eat|kitchen|bar|wine|beer/i],
  ["Health & wellness", /health|fit|gym|well|care|clinic|yoga|nutri/i],

// Reads duration + resolution from a video in the browser (nothing is uploaded)
function probeVideo(url) {
  return new Promise((resolve) => {
    const v = document.createElement("video");
    v.preload = "metadata"; v.muted = true;
    const finish = () => resolve({ duration: v.duration, width: v.videoWidth, height: v.videoHeight });
    v.onloadedmetadata = () => {
      if (Number.isFinite(v.duration)) return finish();
      // Recorded WebM often has no duration header: seek to the end to force it
      v.ontimeupdate = () => { v.ontimeupdate = null; finish(); };
      v.currentTime = 1e101;
    };
    v.onerror = () => resolve({ duration: 0, width: 0, height: 0 });
    v.src = url;
  });
}

function wrapText(ctx, text, maxW) {
  const lines = []; let line = "";
  for (const w of text.split(" ")) {
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function drawAdFrame(ctx, W, H, t, brand, logo) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, brand.colors[0]); g.addColorStop(1, brand.colors[1]);
  ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,.08)";
  ctx.beginPath(); ctx.arc(W * (0.2 + 0.03 * t), H * 0.3, 520, 0, Math.PI * 2); ctx.fill();
  const fade = (a, b) => Math.max(0, Math.min(1, (t - a) / 0.6, (b - t) / 0.6));
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 18; // keeps white text legible on light brand colours (e.g. yellow)

  // 0–4s: logo + name
  let a = fade(0, 4);
  if (a > 0) {
    ctx.globalAlpha = a;
    const s = 0.9 + 0.1 * Math.min(1, t / 1.5), size = 280 * s, x = W / 2 - size / 2, y = H / 2 - 120 - size / 2;
    ctx.fillStyle = logo ? "#fff" : "rgba(255,255,255,.18)";
    ctx.beginPath(); ctx.roundRect(x, y, size, size, 56); ctx.fill();
    if (logo) {
      const r = Math.min((size - 48) / logo.width, (size - 48) / logo.height);
      ctx.drawImage(logo, W / 2 - (logo.width * r) / 2, y + size / 2 - (logo.height * r) / 2, logo.width * r, logo.height * r);
    } else {
      ctx.fillStyle = "#fff"; ctx.font = `800 ${150 * s}px Inter, sans-serif`; ctx.fillText(brand.name[0], W / 2, H / 2 - 120);
    }
    ctx.fillStyle = "#fff"; ctx.font = `800 ${120 * s}px Inter, sans-serif`; ctx.fillText(brand.name, W / 2, H / 2 + 170);
  }
  // 4–9s: what you do
  a = fade(4, 9);
  if (a > 0) {
    ctx.globalAlpha = a; ctx.fillStyle = "#fff"; ctx.font = "700 84px Inter, sans-serif";
    const lines = wrapText(ctx, brand.description.replace(/\s*\(.*?\)\s*/g, " ").trim(), W * 0.72).slice(0, 3);
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + (i - (lines.length - 1) / 2) * 112));
  }
  // 9–12.5s: on TV
  a = fade(9, 12.5);
  if (a > 0) {
    ctx.globalAlpha = a; ctx.fillStyle = "#fff";
    ctx.font = "600 56px Inter, sans-serif"; ctx.fillText(brand.category.toUpperCase(), W / 2, H / 2 - 90);
    ctx.font = "800 120px Inter, sans-serif"; ctx.fillText("Now on TV near you", W / 2, H / 2 + 50);
  }
  // 12.5s–end: call to action
  a = Math.max(0, Math.min(1, (t - 12.5) / 0.6));
  if (a > 0) {
    ctx.globalAlpha = a; ctx.fillStyle = "#fff";
    ctx.font = "600 60px Inter, sans-serif"; ctx.fillText("Visit", W / 2, H / 2 - 100);
    ctx.font = "800 130px Inter, sans-serif"; ctx.fillText(brand.host, W / 2, H / 2 + 40);
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

// Records a real Full HD WebM of the brand-kit ad in real time
async function renderExampleAd(brand, seconds, canvas, onProgress) {
  const W = 1920, H = 1080;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const logo = brand.logoUrl ? await new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = brand.logoUrl; }) : null;
  drawAdFrame(ctx, W, H, 0, brand, logo);
  const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(canvas.captureStream(30), { mimeType: mime, videoBitsPerSecond: 5e6 });
  const chunks = [];
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  const stopped = new Promise((r) => (rec.onstop = r));
  rec.start(500);
  const t0 = performance.now();
  await new Promise((resolve) => {
    const id = setInterval(() => {
      const t = (performance.now() - t0) / 1000;
      drawAdFrame(ctx, W, H, Math.min(t, seconds), brand, logo);
      onProgress(Math.min(1, t / seconds));
      if (t >= seconds) { clearInterval(id); resolve(); }
    }, 1000 / 30);
  });
  rec.stop();
  await stopped;
  return new Blob(chunks, { type: "video/webm" });
}

function brandFromUrl(url) {
  const host = (url || "").replace(/^https?:\/\//, "").replace(/^www\./, "").split(/[\/?#]/)[0] || "yourbrand.com";
  if (KNOWN_BRANDS[host]) return { host, ...KNOWN_BRANDS[host] };
  const stem = host.split(".")[0];
  const name = titleCase(stem.replace(/([a-z])([A-Z])/g, "$1 $2"));
  const cat = (CATEGORY_KEYWORDS.find(([, re]) => re.test(host)) || ["Fashion & retail"])[0];
  const tld = host.split(".").pop();
  const country = { se: "SE", de: "DE", uk: "GB", us: "US" }[tld] || "SE";
  let h = 0; for (const c of host) h = (h * 31 + c.charCodeAt(0)) % 360;
  return {
    host, name, category: cat, country,
    colors: [hslToHex(h, 70, 45), hslToHex((h + 40) % 360, 75, 60), hslToHex((h + 200) % 360, 30, 92)],
    logoUrl: null,
    description: `${name} is a ${cat.toLowerCase()} brand. (Pulled from ${host}, so edit if it's not quite right.)`,
  };
}

function audienceSize(d) {
  const c = COUNTRIES[d.country];
  const base = d.cities.length ? d.cities.reduce((s, k) => s + c.cities[k], 0) : d.region ? c.regions[d.region].hh : c.hh;
  const age = d.ages.length ? d.ages.reduce((s, k) => s + AGES[k], 0) : 1;
  const interest = d.interests.length ? Math.min(0.7, 0.35 + 0.08 * (d.interests.length - 1)) : 1;
  return base * CTV_SHARE * age * INCOME[d.income] * KIDS[d.kids] * GENDER[d.gender || "All"] * interest;
}

function forecast(d) {
  const audience = audienceSize(d);
  const days = durDays(d);
  const total = d.daily * days;
  const impressions = (total / CPM) * 1000;
  const households = Math.min(audience * 0.85, impressions / TARGET_FREQ);
  const frequency = households ? impressions / households : 0;
  const dailyCapacity = audience * 0.12; // impressions/day the audience can realistically absorb
  const dailyNeed = (d.daily / CPM) * 1000;
  return { audience, days, total, impressions, households, frequency, dailyCapacity, dailyNeed, deliverable: dailyNeed <= dailyCapacity };
}

      return existing ? xs.map((c) => (c.id === d.draftId ? rec : c)) : [rec, ...xs];
    });
  }, [d, step, view]);

  const launch = () => {
    const rec = summarize(d, d.creative.status === "later" ? "Needs video" : "In review", null);
    setCampaigns((xs) => xs.some((c) => c.id === rec.id) ? xs.map((c) => (c.id === rec.id ? rec : c)) : [rec, ...xs]);
    track("campaign_launched", { variant, daily: d.daily, days: durDays(d), total: rec.total, goal: d.goal });
    next();
  };

  const nav = (v) => { setView(v); setSelected(null); window.scrollTo(0, 0); track("nav", { to: v }); };

  // Drafts reopen the wizard where they stopped; booked campaigns open their results
  const openCampaign = (c) => {
    if (c.status === "Draft" && c.data) {
      setD(c.data); setReturnTo(null); setView("flow");
      const i = flow.indexOf(c.step);
      setStepIdx(i > 0 ? i : flow.indexOf("business"));
      track("draft_resumed", { step: c.step });
    } else {
      setSelected(c.id); setView("campaign"); window.scrollTo(0, 0);
      track("campaign_results_opened");
    }
  };

  // Copies keep brand, audience, budget and video, but need new dates
  const duplicate = (c) => {
    const data = { ...c.data, draftId: Date.now(), startDate: null, endDate: null };
    setCampaigns((xs) => [{ ...summarize(data, "Draft", "schedule"), name: c.name + " (copy)" }, ...xs]);
    track("campaign_duplicated");
  };

  // Returning customers keep their account, brand and card, and start at the brand step
  const startNew = () => {
    setD((x) => ({ ...INITIAL, email: x.email, website: x.website, password: x.password, brand: x.brand,
      country: x.brand ? x.brand.country : INITIAL.country, cardAdded: x.cardAdded }));
    setView("flow"); setReturnTo(null);
    go(d.brand ? "business" : 0);
    track("start_campaign_clicked");
  };

  const restart = (v = variant) => { setVariant(v); setD(INITIAL); setStepIdx(0); setView("flow"); setReturnTo(null); track("prototype_reset", { variant: v }); };

  const labelled = flow.filter((s) => STEP_META[s].label);
  const curLabelIdx = labelled.indexOf(step);
  const showChrome = !["signup", "success"].includes(step);

  const valid = {
    signup: /\S+@\S+\.\S+/.test(d.email) && d.website.length > 3 && d.password.length >= 6,
    payment: d.cardAdded,
    welcome: true,
    business: !!d.brand,
    goal: !!d.goal,
    audience: true,
    budget: !!d.budgetMode && d.daily >= MIN_DAILY,
    creative: !!d.creative && d.creative.status !== "fail",
    schedule: !!d.startDate,
    review: true,
  }[step];

  const panelEl = html`<${ProtoPanel} open=${panel} setOpen=${setPanel} variant=${variant} setVariant=${restart} billing=${billing} setBilling=${setBilling} events=${events} restart=${restart} flow=${flow} go=${jump}
    onDashboard=${() => nav("campaigns")} clearCampaigns=${() => { setCampaigns(SEED.campaigns); setMedia(SEED.media); }} />`;

  if (view !== "flow") return html`
    <${AppShell} view=${view} nav=${nav} onStart=${startNew}>
      ${view === "home" && html`<${Home} d=${d} campaigns=${campaigns} onStart=${startNew} openCampaign=${openCampaign} nav=${nav} />`}
      ${view === "campaigns" && html`<${Campaigns} campaigns=${campaigns} onStart=${startNew} openCampaign=${openCampaign} duplicate=${duplicate}
        removeCampaign=${removeCampaign} stopCampaign=${stopCampaign} flash=${flash} setFlash=${setFlash} />`}
      ${view === "campaign" && html`<${CampaignDetail} key=${selected} c=${campaigns.find((c) => c.id === selected)} back=${() => nav("campaigns")}
        stop=${stopCampaign} media=${media} nav=${nav} />`}
      ${view === "library" && html`<${Library} media=${media} campaigns=${campaigns} addMedia=${addMedia} removeMedia=${removeMedia} openCampaign=${openCampaign} />`}
      ${view === "reporting" && html`<${Reporting} campaigns=${campaigns} openCampaign=${openCampaign} />`}
      ${view === "admin" && html`<${Admin} users=${users} setUsers=${setUsers} />`}
      ${PLACEHOLDERS[view] && html`<${Placeholder} page=${PLACEHOLDERS[view]} nav=${nav} />`}
    <//>
    ${panelEl}`;

  const Screen = SCREENS[step];
  const reviewIsFinal = variant === "A" && step === "review";
  const paymentIsFinal = variant === "B" && step === "payment";

  return html`
    ${showChrome && html`
      <header class="topbar">
        <${Logo} onClick=${() => nav("home")} />
        <nav class="stepper">
          ${labelled.map((s, i) => html`
            <div key=${s} class=${"s " + (i < curLabelIdx ? "done" : i === curLabelIdx ? "cur" : "")}>
              <span class="n">${i < curLabelIdx ? "✓" : i + 1}</span>${STEP_META[s].label}
            </div>`)}
        </nav>
        <button class="link-btn" onClick=${() => { track("save_and_exit", { step }); setFlash("Draft saved. Pick it up any time by clicking it below. (Real product: we'd also email a 'pick up where you left off' link.)"); nav("campaigns"); }}>Save & exit</button>
      </header>`}

    <main class="fade" key=${step}>
      <${Screen} d=${d} set=${set} next=${next} variant=${variant} go=${go} editFromReview=${editFromReview} media=${media} addMedia=${addMedia} billing=${billing} setBilling=${setBilling}
        onDashboard=${() => { setFlash(`🎉 ${d.brand.name}'s campaign is booked. We'll email you as soon as your video is approved.`); nav("campaigns"); }} />
    </main>

    ${showChrome && step !== "welcome" && html`
      <div class="footer-nav">
        <button class="btn" onClick=${back} disabled=${stepIdx === 0}>← Back</button>
        <div class="row">
          ${returnTo && html`<span class="small muted">Returning to review after this step</span>`}
          ${reviewIsFinal || paymentIsFinal
            ? html`<button class="btn primary lg" disabled=${!valid} onClick=${launch}>
                🚀 Launch campaign</button>`
            : html`<button class="btn primary lg" disabled=${!valid} onClick=${next}>${step === "review" ? "Continue to payment →" : "Continue →"}</button>`}
        </div>
      </div>`}

    ${panelEl}
  `;
}

function Logo({ onClick }) {
  return html`<div class="logo" style=${onClick ? { cursor: "pointer" } : null} title=${onClick ? "Home" : null} onClick=${onClick}>
    <span class="logo-icon"><img src=${LOGO_SRC} alt="" /></span>airspot</div>`;
}

function summarize(d, status, step) {
  const g = GOALS.find((x) => x.id === d.goal);
  const f = d.budgetMode ? forecast(d) : null;
  return {
    id: d.draftId, status, step, updated: Date.now(),
    name: d.brand ? `${d.brand.name}: ${g ? g.t : "New campaign"}` : "New campaign",
    advertiser: d.brand ? d.brand.name : "—", goal: g ? g.t : null,
    daily: f ? d.daily : null, total: f ? f.total : null,
    startDate: d.startDate, endDate: d.startDate ? endDateOf(d) : null,
    households: f ? f.households : null, creative: d.creative ? d.creative.name : null,
    data: d,
  };
}

// Loops the brand-kit ad on a canvas: the preview when there's no playable file
function AdPreview({ brand }) {
  const ref = useRef();
  useEffect(() => {
    const canvas = ref.current;
    canvas.width = 960; canvas.height = 540;
    const ctx = canvas.getContext("2d");
    let logo = null, raf;
    if (brand.logoUrl) { const i = new Image(); i.onload = () => (logo = i); i.src = brand.logoUrl; }
    const t0 = performance.now();
    const loop = () => {
      ctx.save(); ctx.scale(0.5, 0.5);
      drawAdFrame(ctx, 1920, 1080, ((performance.now() - t0) / 1000) % EXAMPLE_SECONDS, brand, logo);
      ctx.restore();
      raf = requestAnimationFrame(loop);
    };
    loop();
    return () => cancelAnimationFrame(raf);
  }, [brand]);
  return html`<canvas ref=${ref} style=${{ width: "100%", height: "100%", display: "block" }}></canvas>`;
}

/* ---------- Screens ---------- */
function Signup({ d, set, next }) {
  const ok = /\S+@\S+\.\S+/.test(d.email) && d.website.length > 3 && d.password.length >= 6;
  return html`
    <div class="auth">
      <div class="row" style=${{ justifyContent: "center", marginBottom: 28 }}><${Logo} /></div>
      <div class="card">
        <h1 style=${{ fontSize: 26, textAlign: "center" }}>Get your brand on TV</h1>
        <p class="lead" style=${{ textAlign: "center", marginBottom: 22 }}>Your first campaign can be live in about 5 minutes, starting from ${fmtUSD(MIN_DAILY)}/day.</p>
        <button class="btn block" onClick=${() => track("signup_google_clicked")}>Continue with Google</button>
        <div class="divider">or</div>
        <div class="stack">
          <div class="field"><label>Work email</label>
            <input class="input" type="email" placeholder="you@company.com" value=${d.email} onInput=${(e) => set({ email: e.target.value })} /></div>
          <div class="field"><label>Company website</label>
            <input class="input" placeholder="yourbrand.com" value=${d.website} onInput=${(e) => set({ website: e.target.value })} />
            <div class="hint">We'll use it to set up your brand and suggest audiences, so you don't have to.</div></div>
          <div class="field"><label>Password</label>
            <input class="input" type="password" placeholder="At least 6 characters" value=${d.password} onInput=${(e) => set({ password: e.target.value })} /></div>
          <button class="btn primary block lg" disabled=${!ok} onClick=${() => { track("account_created", { website: d.website }); next(); }}>Create account</button>
          <button class="link-btn" style=${{ width: "100%" }} onClick=${() => set({ email: "demo@ikea.se", website: DEMO_SITE, password: "demo1234" })}>Fill demo details</button>
        </div>
      </div>
      <p class="small muted" style=${{ textAlign: "center" }}>No card needed to look around.</p>
    </div>`;
}

function BillingToggle({ billing, setBilling }) {
  const pick = (b) => { setBilling(b); track("billing_model_switched", { billing: b }); };
  return html`
    <div class="sim" style=${{ marginTop: 0, marginBottom: 20 }}>
      <span>🧪 Prototype A/B · billing model</span>
      <div class="seg dark">
        <button class=${billing === "advance" ? "on" : ""} onClick=${() => pick("advance")}>Pay in advance</button>
        <button class=${billing === "progressive" ? "on" : ""} onClick=${() => pick("progressive")}>Bill during campaign</button>
      </div>
    </div>`;
}

function Payment({ d, set, variant, billing, setBilling }) {
  const f = forecast(d);
  const upfront = variant === "A";
  const advance = billing === "advance";
  const fill = () => set({ cardAdded: true });
  const launchDay = d.startDate ? niceDate(d.startDate) : "launch day";
  return html`
    <div class="narrow">
      <${BillingToggle} billing=${billing} setBilling=${setBilling} />
      <div class="eyebrow">${upfront ? "Before we start" : "Last step"}</div>
      <h1>${upfront ? "Add a payment method" : "Payment & launch"}</h1>
      ${upfront && html`<p class="lead">You won't be charged anything until you launch a campaign. Adding it now means you can go live as soon as you're ready.</p>`}
      ${!upfront && html`<div class="notice info" style=${{ margin: "8px 0 20px" }}>💳 On launch day (${launchDay}), the full amount of <b>${fmtUSD(f.total)}</b> will be ${advance ? "charged to" : "reserved on"} your card.</div>`}
      <div class=${upfront ? "" : "grid2"} style=${upfront ? {} : { gridTemplateColumns: "1fr 300px" }}>
        <div class="card stack">
          <div class="field"><label>Name on card</label><input class="input" placeholder="Alex Andersson" disabled=${d.cardAdded} /></div>
          <div class="field"><label>Card details</label><input class="input" placeholder="Card number · MM/YY · CVC" disabled=${d.cardAdded} /></div>
          ${d.cardAdded
            ? html`<div class="notice ok">✓ Test card added (prototype: nothing is charged).</div>`
            : html`<button class="btn" onClick=${() => { fill(); track("payment_entered", { variant }); }}>Use prototype test card</button>`}
          <div class="small muted" style=${{ lineHeight: 1.5 }}>
            ${!upfront && html`<div style=${{ marginBottom: 6 }}>${advance
              ? `You'll pay the full ${fmtUSD(f.total)} on launch day. If your ads deliver less than planned, the unused budget is credited back.`
              : `On launch day, the full ${fmtUSD(f.total)} is reserved on your card. We then draw it progressively as your ads run, billed weekly, and release anything unused.`}</div>`}
            🔒 Payments handled by Stripe. Cancel any time before your launch date at no cost.
          </div>
        </div>

function Budget({ d, set }) {
  const f = forecast(d);
  const tiers = useMemo(() => {
    const a = audienceSize(d), days = durDays(d);
    const dailyFor = (share) => Math.min(500, Math.max(MIN_DAILY, Math.round((a * share * TARGET_FREQ / 1000 * CPM) / days / 5) * 5));
    // First campaigns are tests: keep tiers within an SME test budget
    const rec = Math.min(150, Math.max(MIN_DAILY + 25, dailyFor(0.1)));
    const max = Math.min(500, Math.max(rec + 75, dailyFor(0.3)));
    const hh = (daily) => fmtNum(Math.min(a * 0.85, (daily * days / CPM) * 1000 / TARGET_FREQ));
    return [
      { id: "starter", t: "Starter", daily: MIN_DAILY, d: `The minimum. Reaches ~${hh(MIN_DAILY)} households. Enough to learn whether TV works for you.` },
      { id: "rec", t: "Recommended", daily: rec, d: `Reaches ~${hh(rec)} households about 3 times each. The sweet spot for a first campaign.` },
      { id: "max", t: "Max reach", daily: max, d: `Reaches ~${hh(max)} households. Best for launches and time-limited offers.` },
    ];
  }, [d.country, d.region, d.cities, d.ages, d.gender, d.income, d.kids, d.interests, d.weeks, d.startDate, d.endDate]);

  const days = durDays(d);
  const testDaily = d.testBudget / days;
  const applyTest = (total, weeks = d.weeks) => set({ testBudget: total, weeks, endDate: null, daily: Math.max(MIN_DAILY, Math.floor(total / (weeks * 7))) });
  const maxWeeksForTest = Math.floor(d.testBudget / (MIN_DAILY * 7));

  return html`
    <div>
      <div class="eyebrow">Step 4 · Budget</div>
      <h1>How much would you like to spend?</h1>
      <p class="lead">Campaigns run best for about 4 weeks. The minimum is ${fmtUSD(MIN_DAILY)} a day, and you can pause any time.</p>
      <div class="grid2">
        <div class="stack">
          <div class="options">
            <button class=${"option " + (d.budgetMode === "have" ? "on" : "")} onClick=${() => { set({ budgetMode: "have" }); applyTest(d.testBudget); track("budget_mode", { mode: "have" }); }}>
              <div class="ico">💰</div><div class="t">I have a budget in mind</div><div class="d">Tell us your test budget and we'll show what it buys.</div></button>
            <button class=${"option " + (d.budgetMode === "help" ? "on" : "")} onClick=${() => { set({ budgetMode: "help", tier: "rec", daily: tiers[1].daily }); track("budget_mode", { mode: "help" }); }}>
              <div class="ico">🧭</div><div class="t">Help me decide</div><div class="d">We'll recommend a budget based on your audience.</div></button>
          </div>

          <div class="card">
            <h3>How long should it run?</h3>
            <div class="chips">
              ${[2, 4, 6, 8].map((w) => html`<button key=${w} class=${"chip " + (d.weeks === w && !d.endDate ? "on" : "")} onClick=${() => d.budgetMode === "have" ? applyTest(d.testBudget, w) : set({ weeks: w, endDate: null })}>${w} weeks${w === 4 ? " · recommended" : ""}</button>`)}
            </div>
            ${d.endDate && html`<div class="small muted" style=${{ marginTop: 10 }}>Using your custom end date (${fmtDuration(days)}). Pick a length to replace it.</div>`}
          </div>

          ${d.budgetMode === "have" && html`
            <div class="card stack">
              <div class="field"><label>Total test budget (USD)</label>
                <input class="input" type="number" min="0" step="50" value=${d.testBudget} onInput=${(e) => applyTest(Number(e.target.value) || 0)} /></div>
              <${BudgetSlider} d=${d} label="Or drag to set your budget" value=${d.testBudget} min=${250} max=${15000} step=${50}
                onChange=${(v) => applyTest(v)}
                marks=${[{ label: `Minimum ${fmtUSD(MIN_DAILY * days)}`, value: MIN_DAILY * days, active: d.testBudget >= MIN_DAILY * days }]} />
              ${testDaily < MIN_DAILY
                ? html`<div class="notice warn">
                    <b>${fmtUSD(d.testBudget)} over ${d.weeks} weeks is ${fmtUSD(testDaily)}/day</b>, under our ${fmtUSD(MIN_DAILY)}/day minimum. Below that, TV can't reach enough homes often enough to make an impression.
                    <div class="row" style=${{ marginTop: 10 }}>
                      ${maxWeeksForTest >= 1 && html`<button class="btn" onClick=${() => applyTest(d.testBudget, Math.min(8, maxWeeksForTest))}>Run ${maxWeeksForTest} week${maxWeeksForTest > 1 ? "s" : ""} instead</button>`}
                      <button class="btn" onClick=${() => applyTest(MIN_DAILY * days)}>Raise to ${fmtUSD(MIN_DAILY * days)}</button>
                    </div></div>`
                : html`<div class="notice ok">That's <b>${fmtUSD(d.daily)}/day</b> for ${days} days. 👍</div>`}
            </div>`}

          ${d.budgetMode === "help" && html`
            <div class="stack">
              ${tiers.map((t) => html`
                <button key=${t.id} class=${"option " + (d.tier === t.id ? "on" : "")} style=${{ width: "100%" }} onClick=${() => { set({ tier: t.id, daily: t.daily }); track("budget_tier", { tier: t.id, daily: t.daily }); }}>
                  <div class="row between"><div class="t">${t.t} ${t.id === "rec" && html`<span class="tag">Most popular</span>`}</div>
                    <div class="t">${fmtUSD(t.daily)}/day · ${fmtUSD(t.daily * days)}</div></div>
                  <div class="d">${t.d}</div>
                </button>`)}
              <div class="card">
                <${BudgetSlider} d=${d} label=${d.tier === "custom" ? "Custom budget" : "Fine-tune your total budget"}
                  value=${d.daily * days} min=${MIN_DAILY * days} max=${Math.max(300, Math.round(tiers[2].daily * 1.5 / 50) * 50) * days} step=${5 * days}
                  onChange=${(v) => { const daily = Math.round(v / days); set({ daily, tier: (tiers.find((t) => t.daily === daily) || { id: "custom" }).id }); }}
                  marks=${tiers.map((t) => ({ label: t.t, value: t.daily * days, active: d.tier === t.id }))} />
              </div>
            </div>`}
        </div>
        <${ReachPanel} d=${d} showBudget=${!!d.budgetMode} />
      </div>
    </div>`;
}

function specIssues(meta) {
  const issues = [];
  if (!meta.duration) issues.push("We couldn't read this file. Try exporting it again as MP4.");
  else if (![15, 30].some((s) => Math.abs(meta.duration - s) <= 0.6)) issues.push(`Length is ${meta.duration.toFixed(0)}s. TV ad slots are exactly 15 or 30 seconds.`);
  if (meta.height && meta.height < 1080) issues.push(`Resolution is ${meta.width}×${meta.height}. TV needs at least 1920×1080 (Full HD).`);
  return issues;
}

function Creative({ d, set, media, addMedia }) {
  const inputRef = useRef();
  const canvasRef = useRef();
  const [gen, setGen] = useState(null); // null | { progress } | { checking: true }
  const validate = (meta, source) => {
    const issues = specIssues(meta);
    const creative = { ...meta, status: issues.length ? "fail" : "ok", issues };
    if (!issues.length) creative.mediaId = addMedia({ name: meta.name, duration: meta.duration, width: meta.width, height: meta.height, url: meta.url, source });
    set({ creative });
    track("creative_uploaded", { duration: Math.round(meta.duration), height: meta.height, passed: !issues.length });
  };
  const onFile = async (file) => {
    if (!file) return;
    const url = URL.createObjectURL(file);
    const meta = await probeVideo(url);
    validate({ name: file.name, ...meta, url: meta.duration ? url : null }, "upload");
  };
  // Renders a real 15s Full HD video from the brand kit, then runs it through the same checks as an upload
  const generate = async () => {
    track("example_video_started");
    setGen({ progress: 0 });
    await new Promise((r) => setTimeout(r, 50)); // let the canvas mount
    const blob = await renderExampleAd(d.brand, EXAMPLE_SECONDS, canvasRef.current, (p) => setGen({ progress: p }));
    setGen({ checking: true });
    const url = URL.createObjectURL(blob);

function Schedule({ d, set }) {
  const earliest = addBusinessDays(new Date(), APPROVAL_DAYS);
  useEffect(() => { if (!d.startDate) set({ startDate: isoDate(earliest) }); }, []);
  if (!d.startDate) return null;
  const plus = (iso, n) => isoDate(addDays(new Date(iso + "T12:00:00"), n));
  const minEnd = plus(d.startDate, 6); // 7-day minimum run
  const days = durDays(d);
  const setStart = (v) => {
    if (!v) return;
    const patch = { startDate: v };
    if (d.endDate && d.endDate < plus(v, 6)) patch.endDate = plus(v, d.weeks * 7 - 1);
    set(patch); track("start_date_changed");
  };
  return html`
    <div class="narrow">
      <div class="eyebrow">Step 6 · Dates</div>
      <h1>When should it run?</h1>
      <p class="lead">We've picked the earliest start that leaves time for the quality check on your video.</p>
      <div class="card stack">
        <div class="field"><label>Start date</label>
          <input class="input" type="date" min=${isoDate(earliest)} value=${d.startDate} onInput=${(e) => setStart(e.target.value)} /></div>
        <div class="field"><label>End</label>
          <div class="chips">
            <button class=${"chip " + (!d.endDate ? "on" : "")} onClick=${() => { set({ endDate: null }); track("end_date_mode", { mode: "weeks" }); }}>After ${d.weeks} weeks (from your budget)</button>
            <button class=${"chip " + (d.endDate ? "on" : "")} onClick=${() => { if (!d.endDate) set({ endDate: plus(d.startDate, d.weeks * 7 - 1) }); track("end_date_mode", { mode: "date" }); }}>On a specific date</button>
          </div></div>
        ${d.endDate && html`
          <div class="field"><label>End date</label>
            <input class="input" type="date" min=${minEnd} value=${d.endDate} onInput=${(e) => { if (e.target.value >= minEnd) { set({ endDate: e.target.value }); track("end_date_changed"); } }} />
            <div class="hint">Minimum run is 7 days. We recommend at least 4 weeks so TV has time to build up.</div></div>`}
        <div class="notice info">Runs <b>${niceDate(d.startDate)}</b> to <b>${niceDate(endDateOf(d))}</b> (${fmtDuration(days)}). Total spend: <b>${fmtUSD(d.daily * days)}</b> at ${fmtUSD(d.daily)}/day.</div>
        ${days < 28 && html`<div class="notice warn">Shorter than 4 weeks means fewer households reached, less often. Fine for a quick test.</div>`}
      </div>
    </div>`;
}

// Two confetti cannons from the bottom corners; returns a cleanup for useEffect
function launchConfetti(colors) {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const canvas = document.createElement("canvas");
  canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60";
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const W = (canvas.width = innerWidth * dpr), H = (canvas.height = innerHeight * dpr);
  const pieces = Array.from({ length: 180 }, (_, i) => {
    const left = i % 2 === 0;
    const angle = (left ? -60 : -120) * (Math.PI / 180) + (Math.random() - 0.5) * 0.7;
    const speed = Math.sqrt(0.6 * innerHeight) * (0.9 + Math.random() * 0.35) * dpr; // peaks at roughly 50–100% of screen height
    return {
      x: left ? 0 : W, y: H * 0.95, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      w: (6 + Math.random() * 6) * dpr, h: (8 + Math.random() * 8) * dpr,
      rot: Math.random() * Math.PI, spin: (Math.random() - 0.5) * 0.3,
      color: colors[i % colors.length], delay: Math.random() * 200,
    };
  });
  // Time-based (in 60fps "steps") so it looks the same on 60Hz and high-refresh screens
  const DURATION = 3500, start = performance.now();
  let last = start, raf;
  const tick = (now) => {
    const elapsed = now - start, k = Math.min(3, (now - last) / 16.67);
    last = now;
    ctx.clearRect(0, 0, W, H);
    for (const p of pieces) {
      if (elapsed < p.delay) continue;
      p.vy += 0.35 * dpr * k; p.vx *= Math.pow(0.99, k); p.vy *= Math.pow(0.99, k);
      p.x += p.vx * k; p.y += p.vy * k; p.rot += p.spin * k;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - elapsed / DURATION);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot)));
      ctx.restore();
    }
    if (elapsed < DURATION) raf = requestAnimationFrame(tick); else canvas.remove();
  };
  raf = requestAnimationFrame(tick);
  return () => { cancelAnimationFrame(raf); canvas.remove(); };
}

const STATUS_TAG = { Draft: "grey", "In review": "warn", "Needs video": "warn", Live: "ok", Completed: "grey", Stopped: "grey" };
// Running campaigns (and the media in them) can't be deleted until they're stopped
const LOCKED = ["Live", "In review", "Needs video"];
const LOCKED_WHY = { Live: "live on TV", "In review": "booked and in review", "Needs video": "booked and waiting for a video" };
// Booked campaigns move through review → live → completed as their dates pass
const displayStatus = (c) => {
  if (c.status !== "In review" || !c.startDate) return c.status;
  const today = isoDate(new Date());
  return today > c.endDate ? "Completed" : today >= c.startDate ? "Live" : "In review";
};

function Modal({ title, children, actions, onClose }) {
  useEffect(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  return html`
    <div class="modal-bg" onClick=${onClose}>
      <div class="card modal" role="dialog" aria-modal="true" onClick=${(e) => e.stopPropagation()}>
        <h2>${title}</h2>
        <div class="muted" style=${{ lineHeight: 1.55, margin: "10px 0 22px" }}>${children}</div>
        <div class="row" style=${{ justifyContent: "flex-end" }}>${actions}</div>
      </div>
    </div>`;
}

function DeleteCampaignModal({ c, close, remove, stop }) {
  const st = displayStatus(c);
  if (LOCKED.includes(st)) return html`
    <${Modal} title="Stop this campaign first" onClose=${close} actions=${html`
      <button class="btn" onClick=${close}>Cancel</button>
      <button class="btn danger-outline" onClick=${() => stop(c.id)}>■ Stop campaign</button>`}>
      <b>${c.name}</b> is ${LOCKED_WHY[st]}, so it can't be deleted yet. Stopping it ends delivery today and you're only billed for ads already shown. After that you can delete it.
    <//>`;
  return html`
    <${Modal} title="Delete this campaign?" onClose=${close} actions=${html`
      <button class="btn" onClick=${close}>Cancel</button>
      <button class="btn danger" onClick=${() => remove(c)}>Delete campaign</button>`}>
      <b>${c.name}</b> will be permanently removed. This can't be undone.${["Completed", "Stopped"].includes(st) ? " Its results will no longer appear in Reporting." : ""}
    <//>`;
}

                        <button class="btn sm icon" title="Delete campaign" aria-label="Delete campaign"
                          onClick=${(e) => { e.stopPropagation(); setConfirmId(c.id); track("delete_campaign_clicked", { status: st }); }}>🗑</button>
                      </div>
                    </td>
                  </tr>`;
              })}</tbody>
            </table>
          </div>`}
      ${confirming && html`<${DeleteCampaignModal} c=${confirming} close=${() => setConfirmId(null)} stop=${stopCampaign}
        remove=${(c) => { removeCampaign(c.id); setConfirmId(null); setFlash(`Deleted "${c.name}".`); }} />`}
    </div>`;
}

const seeded = (n) => { const x = Math.sin(n) * 10000; return x - Math.floor(x); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const campaignDays = (c) => daysBetween(c.startDate, c.endDate) + 1;
const dayOn = (c, iso) => Math.max(0, Math.min(campaignDays(c), daysBetween(c.startDate, iso) + 1));
const realDayOf = (c) => dayOn(c, isoDate(new Date()));

// Simulated delivery: daily plays vary around budget ÷ CPM, frequency builds over the flight
function simulate(c, dayIn) {
  const days = campaignDays(c);
  const cap = c.stoppedAt ? dayOn(c, c.stoppedAt) : days;
  const day = Math.min(dayIn, cap);
  const daily = Array.from({ length: days }, (_, i) => (i < cap ? (c.daily / CPM) * 1000 * (0.82 + 0.3 * seeded((c.id % 9973) + i)) : 0));
  const impressions = daily.slice(0, day).reduce((s, x) => s + x, 0);
  const spend = Math.min(c.total, (impressions / 1000) * CPM);
  const freq = 1.2 + (TARGET_FREQ - 1.2) * (day / days);
  const households = day ? Math.min(c.households * 1.1, impressions / freq) : 0;
  const vcr = 0.95 + 0.03 * seeded(c.id % 997);
  const completed = impressions * vcr;
  const status = c.stoppedAt && dayIn >= cap ? "Stopped"
    : day === 0 ? (c.status === "Needs video" ? "Needs video" : "In review")
    : day >= days ? "Completed" : "Live";
  const goalResult = day === 0 ? null : {
    reach: { k: "Households reached", v: fmtNum(households), note: `${Math.round((households / c.households) * 100)}% of the ${fmtNum(c.households)} planned` },
    frequency: { k: "Average frequency", v: freq.toFixed(1) + "×", note: `per household, aiming for ${TARGET_FREQ}×` },
    views: { k: "Completed views", v: fmtNum(completed), note: `${(vcr * 100).toFixed(1)}% completion, vs the ~90% TV average` },
    local: { k: "Area coverage", v: Math.round((households / audienceSize(c.data)) * 100) + "%", note: `of the ${fmtNum(audienceSize(c.data))} households in your area` },
  }[c.data?.goal] || null;
  return { days, day, daily, impressions, spend, freq, households, vcr, completed, status, goalResult };
}

  const max = Math.max(1, ...s.daily);

    reach: "Most new households are reached in the first two weeks. After that, the same households start seeing your ad again.",

      </div>

      ${s.day === 0
        ? html`<div class="notice info" style=${{ marginTop: 16 }}>${s.status === "Stopped"
            ? "This campaign was stopped before it started, so nothing was shown or billed."
            : html`Your campaign starts on <b>${niceDate(c.startDate)}</b>. Results appear here from day 1, and after 3 days we'll email you a quick guide to reading them. Drag the slider to preview what that will look like.`}</div>`
        : html`
          <div class="kpis">
            <div class="card"><div class="stat"><div class="k">Spend</div><div class="v">${fmtUSD(s.spend)}</div><div class="small muted">of ${fmtUSD(c.total)}</div>
              <div class="meter"><div style=${{ width: (s.spend / c.total) * 100 + "%", background: "var(--primary)" }}></div></div></div></div>
            <div class="card"><div class="stat"><div class="k">Households reached</div><div class="v">${fmtNum(s.households)}</div><div class="small muted">~${s.freq.toFixed(1)}× each</div></div></div>
            <div class="card"><div class="stat"><div class="k">Ad plays</div><div class="v">${fmtNum(s.impressions)}</div><div class="small muted">~${fmtUSD(CPM)} per 1,000</div></div></div>
            <div class="card"><div class="stat"><div class="k">Completed views</div><div class="v">${fmtNum(s.completed)}</div><div class="small muted">${(s.vcr * 100).toFixed(1)}% watched to the end</div></div></div>
          </div>`}

      <div class="detail-grid">
        <div class="stack">

            <div class="card">
              <h3>What this means</h3>

          Ads stop showing today. You're only billed for ads already shown, and the results so far stay in Reporting.
        <//>`}
    </div>`;
}

// One row per campaign week: matches the Monday check-in email customers get
function WeeklyBreakdown({ c, s }) {
  const weeks = Array.from({ length: Math.ceil(s.days / 7) }, (_, w) => {
    const from = w * 7, to = Math.min(s.days, from + 7);
    const shown = Math.max(0, Math.min(s.day, to) - from);
    const plays = s.daily.slice(from, from + shown).reduce((x, v) => x + v, 0);
    const reachSoFar = shown ? simulate(c, from + shown).households : 0;
    const status = s.day >= to ? "Complete" : shown ? "In progress" : "Upcoming";
    const today = new Date(addDays(new Date(c.startDate + "T12:00:00"), s.day - 1));
    let emailDate = addDays(new Date(c.startDate + "T12:00:00"), to); // first Monday after the week ends
    while (emailDate.getDay() !== 1) emailDate = addDays(emailDate, 1);
    return { w, from, to, plays, spend: (plays / 1000) * CPM, reachSoFar, status, emailDate, emailSent: status === "Complete" && emailDate <= today };
  });
  const maxPlays = Math.max(1, ...weeks.map((wk) => s.daily.slice(wk.from, wk.to).reduce((x, v) => x + v, 0)));
  const fmtRange = (a, b) => `${addDays(new Date(c.startDate + "T12:00:00"), a).toLocaleDateString("en-GB", { day: "numeric", month: "short" })} – ${addDays(new Date(c.startDate + "T12:00:00"), b - 1).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}`;
  return html`
    <div class="card" style=${{ padding: 0, overflow: "auto" }}>
      <div style=${{ padding: "18px 20px 0" }}>
        <h3 style=${{ marginBottom: 4 }}>Weekly performance</h3>
        <p class="small muted" style=${{ margin: 0 }}>The same numbers as your Monday check-in email.</p>
      </div>
      <table class="weeks">
        <thead><tr><th>Week</th><th>Status</th><th>Ad plays</th><th>Spend</th><th>Reach so far</th><th>Check-in email</th></tr></thead>
        <tbody>${weeks.map((wk) => html`
          <tr key=${wk.w}>
            <td><b>Week ${wk.w + 1}</b><div class="small muted">${fmtRange(wk.from, wk.to)}</div></td>
            <td><span class=${"tag " + (wk.status === "Complete" ? "ok" : wk.status === "In progress" ? "" : "grey")}>${wk.status}</span></td>
            <td>${wk.plays ? fmtNum(wk.plays) : "—"}
              <div class="meter" style=${{ width: 90 }}><div style=${{ width: (wk.plays / maxPlays) * 100 + "%", background: "var(--primary)" }}></div></div></td>
            <td>${wk.plays ? fmtUSD(wk.spend) : "—"}</td>
            <td>${wk.reachSoFar ? fmtNum(wk.reachSoFar) + " households" : "—"}</td>
            <td class="small muted">${`${wk.emailSent ? "✉ Sent" : "Due"} ${wk.emailDate.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })}`}</td>
          </tr>`)}</tbody>
      </table>
    </div>`;
}

/* ---------- Library ---------- */
const SOURCE_LABEL = { upload: "Uploaded", generated: "Generated from brand kit", sample: "Sample" };

function DeleteMediaModal({ m, used, close, remove }) {
  const running = used.filter((c) => LOCKED.includes(displayStatus(c)));
  if (running.length) return html`
    <${Modal} title="This video is in use" onClose=${close} actions=${html`<button class="btn" onClick=${close}>OK</button>`}>
      <b>${m.name}</b> is running in ${running.map((c) => c.name).join(", ")}. Stop ${running.length > 1 ? "those campaigns" : "that campaign"} before deleting it, so nothing goes off air by accident.
    <//>`;
  const drafts = used.filter((c) => c.status === "Draft");
  const finished = used.length - drafts.length;
  return html`
    <${Modal} title="Delete this video?" onClose=${close} actions=${html`
      <button class="btn" onClick=${close}>Cancel</button>
      <button class="btn danger" onClick=${() => remove(m.id)}>Delete video</button>`}>
      <b>${m.name}</b> will be removed from your library.${drafts.length ? ` ${drafts.length} draft campaign${drafts.length > 1 ? "s" : ""} will need a new video.` : ""}${finished ? " Finished campaigns keep their results." : ""}
    <//>`;
}

function Library({ media, campaigns, addMedia, removeMedia, openCampaign }) {
  const inputRef = useRef();
  const [msg, setMsg] = useState(null);
  const [confirmId, setConfirmId] = useState(null);
  const usage = (m) => campaigns.filter((c) => c.data?.creative?.mediaId === m.id);
  const confirming = media.find((m) => m.id === confirmId);
  const upload = async (file) => {
    if (!file) return;
    const url = URL.createObjectURL(file);
    const meta = await probeVideo(url);
    const issues = specIssues(meta);
    if (issues.length) { setMsg({ type: "err", text: `${file.name} wasn't added. ${issues.join(" ")}` }); track("library_upload_failed"); return; }
    addMedia({ name: file.name, ...meta, url, source: "upload" });
    setMsg({ type: "ok", text: `${file.name} passed the TV checks and was added to your library.` });
  };
  return html`
    <div>
      <div class="row between">
        <h1>Library</h1>
        <div class="row">
          <span class="small muted">${media.length} video${media.length === 1 ? "" : "s"}</span>
          <button class="btn primary" onClick=${() => inputRef.current.click()}>⬆ Upload</button>
          <input ref=${inputRef} type="file" accept="video/*" style=${{ display: "none" }} onChange=${(e) => { upload(e.target.files[0]); e.target.value = ""; }} />
        </div>
      </div>
      ${msg && html`<div class=${"notice row between " + msg.type} style=${{ marginTop: 12 }}><span>${msg.text}</span><button class="link-btn" onClick=${() => setMsg(null)}>✕</button></div>`}
      ${media.length === 0
        ? html`<div class="card" style=${{ textAlign: "center", padding: 48, marginTop: 16 }}><h2>No videos yet</h2><p class="muted">Videos you upload or generate while creating a campaign show up here.</p></div>`
        : html`<div class="card" style=${{ padding: 0, overflow: "auto", marginTop: 16 }}>
            <table>
              <thead><tr><th>Video</th><th>Length</th><th>Resolution</th><th>Added</th><th>Used in</th><th></th></tr></thead>
              <tbody>${media.map((m) => {
                const used = usage(m);
                return html`
                  <tr key=${m.id}>
                    <td><div class="row" style=${{ flexWrap: "nowrap" }}>
                      <div class="thumb">${m.url ? html`<video src=${m.url} muted preload="metadata"></video>` : "▶"}</div>
                      <div><b>${m.name}</b><div class="small muted">${SOURCE_LABEL[m.source] || "Uploaded"}${m.url || m.source === "sample" ? "" : " · re-upload to preview"}</div></div>
                    </div></td>
                    <td>${Math.round(m.duration)}s</td>
                    <td>${m.width}×${m.height}</td>
                    <td>${niceDate(m.addedAt)}</td>
                    <td>${used.length
                      ? used.map((c) => { const st = displayStatus(c); return html`
                          <div key=${c.id} style=${{ marginBottom: 4 }}>
                            <button class="link-btn" style=${{ padding: "2px 0" }} onClick=${() => openCampaign(c)}>${c.name}</button>
                            <span class=${"tag " + (STATUS_TAG[st] || "grey")}>● ${st}</span>
                          </div>`; })
                      : html`<span class="small muted">Not used yet</span>`}</td>
                    <td style=${{ textAlign: "right" }}>
                      <button class="btn sm icon" title="Delete video" aria-label="Delete video" onClick=${() => { setConfirmId(m.id); track("delete_media_clicked"); }}>🗑</button>
                    </td>
                  </tr>`;
              })}</tbody>
            </table>
          </div>`}
      ${confirming && html`<${DeleteMediaModal} m=${confirming} used=${usage(confirming)} close=${() => setConfirmId(null)}
        remove=${(id) => { removeMedia(id); setConfirmId(null); setMsg({ type: "info", text: `Deleted ${confirming.name}.` }); }} />`}
    </div>`;
}

/* ---------- Reporting ---------- */
const PALETTE = ["#1f5bff", "#14b8a6", "#f59e0b", "#a855f7", "#ef4444"];

function Reporting({ campaigns, openCampaign }) {
  const booked = campaigns.filter((c) => c.status !== "Draft" && c.startDate && c.data);
  const start = booked.length ? booked.map((c) => c.startDate).sort()[0] : isoDate(new Date());
  const end = booked.length ? booked.map((c) => c.endDate).sort().slice(-1)[0] : start;
  const span = daysBetween(start, end) + 1;
  const [filter, setFilter] = useState("all");
  const [idx, setIdx] = useState(() => Math.max(0, Math.min(span - 1, daysBetween(start, isoDate(new Date())))));
  if (!booked.length) return html`<div><h1>Reporting</h1><div class="card" style=${{ textAlign: "center", padding: 48, marginTop: 16 }}><h2>No results yet</h2><p class="muted">Results appear here once your first campaign is live.</p></div></div>`;

  const simDate = isoDate(addDays(new Date(start + "T12:00:00"), idx));
  const colorOf = (c) => PALETTE[booked.indexOf(c) % PALETTE.length];
  const shown = filter === "all" ? booked : booked.filter((c) => c.id === filter);
  const rows = shown.map((c) => ({ c, s: simulate(c, dayOn(c, simDate)) }));
  const tot = rows.reduce((t, { s }) => ({ spend: t.spend + s.spend, hh: t.hh + s.households, imp: t.imp + s.impressions, done: t.done + s.completed }), { spend: 0, hh: 0, imp: 0, done: 0 });
  const budget = shown.reduce((x, c) => x + c.total, 0);
  // One stacked bar per calendar day across every campaign shown
  const full = shown.map((c) => ({ c, daily: simulate(c, campaignDays(c)).daily, off: daysBetween(start, c.startDate) }));
  const stacks = Array.from({ length: span }, (_, i) => full.map((f) => ({ c: f.c, v: f.daily[i - f.off] || 0 })));
  const max = Math.max(1, ...stacks.map((st) => st.reduce((x, b) => x + b.v, 0)));

  return html`
    <div>
      <div class="row between"><h1>Reporting</h1><span class="small muted">${booked.length} booked campaign${booked.length === 1 ? "" : "s"}</span></div>
      <div class="chips" style=${{ marginTop: 12 }}>
        <button class=${"chip " + (filter === "all" ? "on" : "")} onClick=${() => setFilter("all")}>All campaigns</button>
        ${booked.map((c) => html`<button key=${c.id} class=${"chip " + (filter === c.id ? "on" : "")} onClick=${() => setFilter(c.id)}><span class="dot-l" style=${{ background: colorOf(c) }}></span>${c.name}</button>`)}
      </div>

      <div class="sim">
        <span>🧪 Prototype: simulate date</span>
        <input type="range" min="0" max=${span - 1} value=${idx} onInput=${(e) => setIdx(Number(e.target.value))} />
        <b>${niceDate(simDate)}</b>
      </div>

      <div class="kpis">
        <div class="card"><div class="stat"><div class="k">Spend</div><div class="v">${fmtUSD(tot.spend)}</div><div class="small muted">of ${fmtUSD(budget)} booked</div>
          <div class="meter"><div style=${{ width: (tot.spend / budget) * 100 + "%", background: "var(--primary)" }}></div></div></div></div>
        <div class="card"><div class="stat"><div class="k">Households reached</div><div class="v">${fmtNum(tot.hh)}</div><div class="small muted">across ${shown.length} campaign${shown.length === 1 ? "" : "s"}</div></div></div>
        <div class="card"><div class="stat"><div class="k">Ad plays</div><div class="v">${fmtNum(tot.imp)}</div><div class="small muted">${tot.imp ? fmtUSD((tot.spend / tot.imp) * 1000) : "—"} per 1,000</div></div></div>
        <div class="card"><div class="stat"><div class="k">Completion rate</div><div class="v">${tot.imp ? ((tot.done / tot.imp) * 100).toFixed(1) + "%" : "—"}</div><div class="small muted">TV average ~90%</div></div></div>
      </div>

      <div class="card" style=${{ marginTop: 16 }}>
        <div class="row between">
          <h3 style=${{ margin: 0 }}>Daily ad plays</h3>
          <div class="row small muted" style=${{ gap: 14 }}>${shown.map((c) => html`<span key=${c.id}><span class="dot-l" style=${{ background: colorOf(c) }}></span>${c.goal}</span>`)}</div>
        </div>
        <svg viewBox=${`0 0 ${span * 10} 100`} preserveAspectRatio="none" style=${{ width: "100%", height: 180, display: "block", marginTop: 12 }}>
          ${stacks.map((st, i) => { let y = 100; return st.map(({ c, v }, j) => { const h = (v / max) * 92; y -= h;
            return html`<rect key=${i + "-" + j} x=${i * 10 + 1.5} width="7" y=${y} height=${h} fill=${colorOf(c)} opacity=${i <= idx ? 1 : 0.18} />`; }); })}
          <line x1=${idx * 10 + 5} x2=${idx * 10 + 5} y1="0" y2="100" stroke="#0f172a" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" />
        </svg>
        <div class="row between small muted" style=${{ marginTop: 6 }}><span>${niceDate(start)}</span><span>${niceDate(end)}</span></div>
      </div>

      <div class="card" style=${{ padding: 0, overflow: "auto", marginTop: 16 }}>
        <table>
          <thead><tr><th>Campaign</th><th>Goal</th><th>Status</th><th>Spend</th><th>Households</th><th>Ad plays</th><th>Completion</th><th>Goal result</th></tr></thead>
          <tbody>${rows.map(({ c, s }) => html`
            <tr key=${c.id} class="clickable" onClick=${() => openCampaign(c)} title="View full breakdown">
              <td><span class="dot-l" style=${{ background: colorOf(c) }}></span><b>${c.name}</b><div class="small muted">${fmtUSD(c.daily)}/day · ${niceDate(c.startDate)} to ${niceDate(c.endDate)}</div></td>
              <td><span class="tag grey">${c.goal.toUpperCase()}</span></td>
              <td><span class=${"tag " + (STATUS_TAG[s.status] || "grey")}>● ${s.status}</span></td>
              <td>${fmtUSD(s.spend)}<div class="small muted">of ${fmtUSD(c.total)}</div></td>
              <td>${fmtNum(s.households)}</td>
              <td>${fmtNum(s.impressions)}</td>
              <td>${s.day ? (s.vcr * 100).toFixed(1) + "%" : "—"}</td>
              <td>${s.goalResult ? html`<b>${s.goalResult.v}</b><div class="small muted">${s.goalResult.k}</div>` : "—"}</td>
            </tr>`)}</tbody>
        </table>
      </div>
      <p class="small muted">Click a campaign for its full breakdown.</p>
    </div>`;
}

/* ---------- Admin (placeholder roles, no real access control) ---------- */
const CAPS = ["Launch & edit campaigns", "Manage budget & billing", "Upload & delete media", "View reports", "Manage users"];
const ROLE_CAPS = { Owner: [1, 1, 1, 1, 1], Admin: [1, 0, 1, 1, 1], "Campaign manager": [1, 0, 1, 1, 0], Viewer: [0, 0, 0, 1, 0] };
const DEFAULT_USERS = [
  { id: 1, name: "Alex Andersson", email: "alex@ikea.se", role: "Owner", status: "Active", last: "Active now", you: true },
  { id: 2, name: "Sam Lindqvist", email: "sam@ikea.se", role: "Admin", status: "Active", last: "2 hours ago" },
  { id: 3, name: "Jordan Berg", email: "jordan@ikea.se", role: "Campaign manager", status: "Active", last: "Yesterday" },
  { id: 4, name: "Robin Ek", email: "robin@nordicmedia.example", role: "Campaign manager", status: "Active", last: "3 days ago", note: "Agency" },
  { id: 5, name: "Kim Nilsson", email: "kim@ikea.se", role: "Viewer", status: "Invited", last: "—" },
];

function Admin({ users, setUsers }) {
  const [invite, setInvite] = useState(null);
  const [removeId, setRemoveId] = useState(null);
  const removing = users.find((u) => u.id === removeId);
  const setRole = (id, role) => { setUsers((xs) => xs.map((u) => (u.id === id ? { ...u, role } : u))); track("user_role_changed", { role }); };
  const validEmail = invite && /\S+@\S+\.\S+/.test(invite.email);
  return html`
    <div>
      <div class="row between"><h1>Admin</h1><button class="btn primary" onClick=${() => setInvite({ email: "", role: "Campaign manager" })}>+ Invite user</button></div>
      <div class="notice info" style=${{ marginTop: 12 }}>Placeholder: these roles are illustrative. No access control is enforced in this prototype.</div>

      <div class="card" style=${{ padding: 0, overflow: "auto", marginTop: 16 }}>
        <table>
          <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last active</th><th></th></tr></thead>
          <tbody>${users.map((u) => html`
            <tr key=${u.id}>
              <td><div class="row" style=${{ flexWrap: "nowrap" }}>
                <span class="avatar">${u.name.split(" ").map((p) => p[0]).join("")}</span>
                <div><b>${u.name}</b>${u.you ? html` <span class="tag grey">You</span>` : ""}${u.note ? html` <span class="tag grey">${u.note}</span>` : ""}<div class="small muted">${u.email}</div></div>
              </div></td>
              <td>${u.role === "Owner"
                ? html`<b>Owner</b>`
                : html`<select class="input" style=${{ padding: "7px 10px", width: "auto" }} value=${u.role} onChange=${(e) => setRole(u.id, e.target.value)}>
                    ${Object.keys(ROLE_CAPS).filter((r) => r !== "Owner").map((r) => html`<option key=${r}>${r}</option>`)}
                  </select>`}</td>
              <td><span class=${"tag " + (u.status === "Active" ? "ok" : "warn")}>● ${u.status}</span></td>
              <td class="muted">${u.last}</td>
              <td style=${{ textAlign: "right" }}>${!u.you && html`<button class="btn sm icon" title="Remove user" aria-label="Remove user" onClick=${() => setRemoveId(u.id)}>✕</button>`}</td>
            </tr>`)}</tbody>
        </table>
      </div>

      <div class="card" style=${{ padding: 0, overflow: "auto", marginTop: 16 }}>
        <div style=${{ padding: "18px 20px 0" }}><h3>What each role can do</h3></div>
        <table>
          <thead><tr><th>Permission</th>${Object.keys(ROLE_CAPS).map((r) => html`<th key=${r} style=${{ textAlign: "center" }}>${r}</th>`)}</tr></thead>
          <tbody>${CAPS.map((cap, i) => html`
            <tr key=${cap}><td>${cap}</td>${Object.entries(ROLE_CAPS).map(([r, caps]) => html`
              <td key=${r} style=${{ textAlign: "center", color: caps[i] ? "var(--ok)" : "var(--subtle)", fontWeight: 600 }}>${caps[i] ? "✓" : "—"}</td>`)}</tr>`)}</tbody>
        </table>
      </div>

      ${invite && html`
        <${Modal} title="Invite a teammate" onClose=${() => setInvite(null)} actions=${html`
          <button class="btn" onClick=${() => setInvite(null)}>Cancel</button>
          <button class="btn primary" disabled=${!validEmail} onClick=${() => {
            setUsers((xs) => [...xs, { id: Date.now(), name: invite.email.split("@")[0].replace(/[._]/g, " ").replace(/\b\w/g, (ch) => ch.toUpperCase()), email: invite.email, role: invite.role, status: "Invited", last: "—" }]);
            track("user_invited", { role: invite.role }); setInvite(null); }}>Send invite</button>`}>
          <div class="stack" style=${{ color: "var(--text)" }}>
            <div class="field"><label>Email</label><input class="input" placeholder="name@company.com" value=${invite.email} onInput=${(e) => setInvite({ ...invite, email: e.target.value })} /></div>
            <div class="field"><label>Role</label>
              <select class="input" value=${invite.role} onChange=${(e) => setInvite({ ...invite, role: e.target.value })}>
                ${Object.keys(ROLE_CAPS).filter((r) => r !== "Owner").map((r) => html`<option key=${r}>${r}</option>`)}
              </select></div>
          </div>
        <//>`}

      ${removing && html`
        <${Modal} title="Remove this user?" onClose=${() => setRemoveId(null)} actions=${html`
          <button class="btn" onClick=${() => setRemoveId(null)}>Cancel</button>
          <button class="btn danger" onClick=${() => { setUsers((xs) => xs.filter((u) => u.id !== removeId)); setRemoveId(null); track("user_removed"); }}>Remove</button>`}>
          <b>${removing.name}</b> will lose access to this account. Their campaigns stay as they are.
        <//>`}
    </div>`;
}

function ProtoPanel({ open, setOpen, variant, setVariant, billing, setBilling, events, restart, flow, go, onDashboard, clearCampaigns }) {
  return html`
    <button class="proto-fab" onClick=${() => setOpen(!open)}>⚙ Prototype controls</button>
    ${open && html`
      <div class="proto">
        <h4>A/B: payment position</h4>
        <div class="seg">
          <button class=${variant === "A" ? "on" : ""} onClick=${() => setVariant("A")}>A · Card upfront</button>
          <button class=${variant === "B" ? "on" : ""} onClick=${() => setVariant("B")}>B · Pay at launch</button>
        </div>
        <div style=${{ color: "#9ca3af", marginBottom: 14 }}>Switching variant restarts the flow.</div>
        <h4>A/B: billing model</h4>
        <div class="seg">
          <button class=${billing === "advance" ? "on" : ""} onClick=${() => setBilling("advance")}>Pay in advance</button>
          <button class=${billing === "progressive" ? "on" : ""} onClick=${() => setBilling("progressive")}>Bill during campaign</button>
        </div>
        <div style=${{ color: "#9ca3af", marginBottom: 14 }}>Changes the payment copy and summary.</div>
        <h4>Jump to step</h4>
        <div class="row" style=${{ gap: 6, marginBottom: 14 }}>
          ${flow.map((s) => html`<button key=${s} class="pbtn" onClick=${() => go(s)}>${s}</button>`)}
          <button class="pbtn" onClick=${onDashboard}>dashboard</button>
          <button class="pbtn" onClick=${() => restart()}>↺ reset</button>
          <button class="pbtn" onClick=${clearCampaigns}>reset demo data</button>
        </div>
        <h4>Tracked events (${events.length})</h4>
        ${events.length === 0 && html`<div style=${{ color: "#6b7280" }}>No events yet.</div>`}
        ${events.map((e, i) => html`<div class="ev" key=${i}><span>${e.t}</span> ${e.name} <span>${Object.keys(e.props).length ? JSON.stringify(e.props) : ""}</span></div>`)}
      </div>`}`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
